services:
  validator:
    build: .
    container_name: email-validator
    ports:
      - "8000:8000"
    # Aplikacja ma sensowne domyslne wartosci, ale konfiguracje (w tym dane LLM:
    # AI_BASE_URL / AI_MODEL / AI_API_KEY) czyta ze zmiennych srodowiskowych.
    # env_file wstrzykuje .env do dzialajacego kontenera (skopiuj .env.example do .env).
    # required: false => brak pliku .env nie wywraca `docker compose up`.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # Dolaczyc do sieci wewnetrznej CRM, jesli trzeba:
    # networks: [crm_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3

